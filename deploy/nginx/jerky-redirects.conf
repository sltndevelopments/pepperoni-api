# 301 — misspellings / translit onto canonical /jerky
# Install: bash scripts/install_jerky_redirects_vps.sh
# Included from pepperoni.tatar server{} as:
#   include /etc/nginx/snippets/jerky-redirects.conf;

location = /jerks {
    return 301 https://pepperoni.tatar/jerky;
}
location = /dzherki {
    return 301 https://pepperoni.tatar/jerky;
}
location = /en/jerks {
    return 301 https://pepperoni.tatar/en/jerky;
}
