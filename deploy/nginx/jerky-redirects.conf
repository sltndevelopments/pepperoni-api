# Alias URLs for /jerky. Install: bash scripts/install_jerky_redirects_vps.sh
# Included from pepperoni.tatar server{} as:
#   include /etc/nginx/snippets/jerky-redirects.conf;

location = /jerks { return 301 /jerky; }
location = /jerks.html { return 301 /jerky; }
location = /jerks/ { return 301 /jerky; }
location = /dzherki { return 301 /jerky; }
location = /dzherki.html { return 301 /jerky; }
location = /dzherki/ { return 301 /jerky; }
location = /en/jerks { return 301 /en/jerky; }
location = /en/jerks.html { return 301 /en/jerky; }
location = /en/jerks/ { return 301 /en/jerky; }
