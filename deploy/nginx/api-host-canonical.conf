# api.pepperoni.tatar is the data host. Include in its HTTPS server block BEFORE
# `location /`. Installed by scripts/apply_nginx_canonical_hosts.sh.
#
# The catch-all `location /` proxies to Vercel, which serves the whole HTML site
# under this hostname with `X-Robots-Tag: index, follow`. That made
# api.pepperoni.tatar a full duplicate of pepperoni.tatar (GSC already lists
# /about, /products/kd-*, /blog/* on the api host). Only machine endpoints stay;
# every other path is sent to the apex.
#
# Allowlist (regex prefix, negative lookahead): API, MCP, discovery files, feeds,
# webhooks and proxies that other server-level locations expect to handle.
location ~ ^/(?!$|api(/|$)|\.well-known/|openapi|llms|products\.json|robots\.txt|sitemap|ai-plugin|mcp|health|feed|partner-|sheets-proxy/|sheets-guc/|alice-webhook|sales-track/|favicon\.ico) {
    add_header X-Robots-Tag "noindex" always;
    return 301 https://pepperoni.tatar$request_uri;
}
