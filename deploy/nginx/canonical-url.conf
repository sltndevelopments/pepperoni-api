# Canonical URL form for pepperoni.tatar — include in the HTTPS server block
# BEFORE `location /`. Installed by scripts/apply_nginx_canonical_hosts.sh.
#
# Policy: no trailing slash anywhere except the two locale roots "/" and "/en/".
# Before this, `/products/` and `/products` (and every `/slug/`) both answered 200
# via `try_files ... $uri/ @vercel`, so GSC reported 800+ slash duplicates and
# canonical/sitemap disagreed (`/en` vs `/en/`).

# Locale root: keep the slash form (183 internal links + canonical use it).
# `location = /en/` itself already lives in pepperoni-static-data.conf.
location = /en {
    return 301 https://pepperoni.tatar/en/;
}

# Catalog hubs sit under `^~ /products/` prefixes (pepperoni-static-data.conf),
# which outrank the regex below — exact matches are needed here.
location = /products/ {
    return 301 https://pepperoni.tatar/products;
}
location = /en/products/ {
    return 301 https://pepperoni.tatar/en/products;
}

# Everything else: strip the trailing slash. Exact-match `location =` blocks in
# the generated 301/410 snippets take precedence, `^~ /geo/` prefixes as well.
location ~ ^/(.+)/$ {
    return 301 https://pepperoni.tatar/$1$is_args$args;
}
