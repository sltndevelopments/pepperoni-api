# On-site catalog assistant — proxied to pepperoni-mcp on 127.0.0.1:8130.
# CORS is set once by the Node process. Do not add_header here: a second
# Access-Control-Allow-Origin makes browsers drop the response.
# Include in api.pepperoni.tatar AND pepperoni.tatar HTTPS servers, BEFORE location /.

location = /api/catalog-chat {
    proxy_pass http://127.0.0.1:8130;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Origin $http_origin;
    proxy_set_header Referer $http_referer;
    proxy_read_timeout 30s;
    client_max_body_size 8k;
}
