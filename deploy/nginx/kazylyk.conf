# kazylyk.com — static vhost. Install after TLS exists.
# Document root: kazylyk/ on the VPS (or a release symlink).
# Cloudflare must stay DNS-only (grey cloud). Do not enable proxy.

server {
    listen 80;
    listen [::]:80;
    server_name kazylyk.com www.kazylyk.com;
    return 301 https://kazylyk.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.kazylyk.com;

    ssl_certificate /etc/letsencrypt/live/kazylyk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kazylyk.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://kazylyk.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name kazylyk.com;

    root /var/www/kazylyk/current;
    index index.html;
    autoindex off;

    ssl_certificate /etc/letsencrypt/live/kazylyk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kazylyk.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:KazylykTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Link "</llms.txt>; rel=\"alternate\"; type=\"text/plain\", </index.md>; rel=\"alternate\"; type=\"text/markdown\", </.well-known/ai-catalog.json>; rel=\"describedby\"; type=\"application/json\"" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location = /.well-known/ai-catalog.json {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Content-Type "application/json; charset=utf-8" always;
        try_files $uri =404;
        expires 1h;
    }

    location = /robots.txt {
        try_files $uri =404;
        expires 1h;
    }

    location = /sitemap.xml {
        try_files $uri =404;
        expires 1h;
    }

    location = /llms.txt {
        default_type text/plain;
        charset utf-8;
        try_files $uri =404;
        expires 1h;
    }

    location = / {
        if ($http_accept ~* "text/markdown") {
            rewrite ^ /index.md last;
        }
        try_files /index.html =404;
        expires -1;
    }

    location = /products/kazylyk/ {
        if ($http_accept ~* "text/markdown") {
            rewrite ^ /products/kazylyk/index.md last;
        }
        try_files /products/kazylyk/index.html =404;
        expires -1;
    }

    location = /products/chak-chak/ {
        if ($http_accept ~* "text/markdown") {
            rewrite ^ /products/chak-chak/index.md last;
        }
        try_files /products/chak-chak/index.html =404;
        expires -1;
    }

    location ~ \.md$ {
        default_type text/markdown;
        charset utf-8;
        add_header Content-Type "text/markdown; charset=utf-8" always;
        try_files $uri =404;
        expires 1h;
    }

    location ~* \.(?:png|jpe?g|webp|avif|gif|ico|svg|woff2)$ {
        try_files $uri =404;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~* \.(?:css|js)$ {
        try_files $uri =404;
        expires 7d;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
        expires -1;
    }
}
