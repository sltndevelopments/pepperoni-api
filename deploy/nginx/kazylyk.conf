# kazylyk.com — static vhost. Install after TLS exists.
# Document root: kazylyk/ on the VPS (or a release symlink).
# Cloudflare must stay DNS-only (grey cloud). Do not enable proxy.

server {
    listen 80;
    listen [::]:80;
    server_name kazylyk.com www.kazylyk.com;
    return 301 https://kazylyk.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.kazylyk.com;

    ssl_certificate /etc/letsencrypt/live/kazylyk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kazylyk.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://kazylyk.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name kazylyk.com;

    root /var/www/kazylyk/current;
    index index.html;
    autoindex off;

    ssl_certificate /etc/letsencrypt/live/kazylyk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kazylyk.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:KazylykTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location = /robots.txt {
        try_files $uri =404;
        expires 1h;
    }

    location = /sitemap.xml {
        try_files $uri =404;
        expires 1h;
    }

    location ~* \.(?:png|jpe?g|webp|gif|ico|svg)$ {
        try_files $uri =404;
        expires 365d;
    }

    location ~* \.(?:css|js)$ {
        try_files $uri =404;
        expires 7d;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
        expires -1;
    }
}
