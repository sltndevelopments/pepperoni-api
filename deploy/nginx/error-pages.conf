# Branded 404 for pepperoni.tatar — include in the HTTPS server block BEFORE
# `location /`. Installed by scripts/apply_nginx_error_pages.sh.
#
# Before this (audit 2026-09-12) a missing URL answered with a bare 79-byte
# "NOT_FOUND" body, no <title>, no navigation and the server-wide
# `X-Robots-Tag: index, follow`. public/404.html carries its own
# <meta name="robots" content="noindex, follow"> and links to the money pages.
# 410 responses from the *-gone snippets are left as-is (nothing to navigate to).

error_page 404 /404.html;

location = /404.html {
    internal;
    root /var/www/pepperoni/repo/public;
}

# Working copies must never be served (2026-09-13: 51 `_removed_*.bak` files with
# retired claims answered 200 and were fetchable by LLM crawlers).
location ~* \.(bak|orig|tmp|swp)$ {
    return 404;
}
