# Hand-maintained: Gulf Yemen landings retired from keep (content-plan: Gulf is a
# section on /export, not a country page). Uzbekistan took the keep slot.
# AUTO-GENERATED trust-reset-redirects.conf does not cover these until a full
# apply_index_consolidation --apply; this snippet is installed every deploy.
location = /export/yemen { return 301 https://pepperoni.tatar/export; }
location = /export/yemen.html { return 301 https://pepperoni.tatar/export; }
location = /export/yemen/ { return 301 https://pepperoni.tatar/export; }
location = /en/export/yemen { return 301 https://pepperoni.tatar/en/export; }
location = /en/export/yemen.html { return 301 https://pepperoni.tatar/en/export; }
location = /en/export/yemen/ { return 301 https://pepperoni.tatar/en/export; }
