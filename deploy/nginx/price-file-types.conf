# Serve /prices.xlsx and /prices.pdf with the right Content-Type.
# Default nginx mime.types often maps xlsx as application/octet-stream (or
# misses it). vercel.json headers do not apply on the VPS.
# Include in the pepperoni.tatar HTTPS server BEFORE location /.
# Installed by scripts/apply_nginx_price_types.sh (deploy-vps.yml).

location = /prices.xlsx {
    alias /var/www/pepperoni/repo/public/prices.xlsx;
    default_type application/vnd.openxmlformats-officedocument.spreadsheetml.sheet;
    add_header Content-Disposition 'attachment; filename="prices.xlsx"' always;
    add_header Cache-Control "public, max-age=600" always;
}

location = /prices.pdf {
    alias /var/www/pepperoni/repo/public/prices.pdf;
    default_type application/pdf;
    add_header Content-Disposition 'inline; filename="prices.pdf"' always;
    add_header Cache-Control "public, max-age=600" always;
}
