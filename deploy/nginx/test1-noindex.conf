# Include inside the pepperoni.tatar server { } block.
# Overrides the global X-Robots-Tag: index, follow for the /test1 experiment page.
location = /test1 {
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files /test1.html =404;
}

location = /test1.html {
    add_header X-Robots-Tag "noindex, nofollow" always;
}
