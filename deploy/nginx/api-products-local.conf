# Serve the live catalog and agent discovery files from VPS files — do not proxy
# them to Vercel. Vercel bot-protection answers non-browser clients (MCP, LLM
# crawlers, curl) with a 403 "Security Checkpoint" page (x-vercel-mitigated:
# challenge). Observed 2026-09-09 on /llms.txt, /robots.txt, /openapi.yaml and
# /.well-known/ai-plugin.json — i.e. exactly the files agents read first.
# Include in the api.pepperoni.tatar HTTPS server, BEFORE location /.
# Installed by scripts/apply_nginx_api_products.sh (also run by deploy-vps.yml).

location = /llms.txt {
    alias /var/www/pepperoni/repo/public/llms.txt;
    default_type text/plain;
    charset utf-8;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=600" always;
    add_header X-Data-Source "vps-local" always;
}

location = /robots.txt {
    alias /var/www/pepperoni/repo/public/robots.txt;
    default_type text/plain;
    charset utf-8;
    add_header Cache-Control "public, max-age=600" always;
    add_header X-Data-Source "vps-local" always;
}

location = /openapi.yaml {
    alias /var/www/pepperoni/repo/public/openapi.yaml;
    default_type application/yaml;
    charset utf-8;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=600" always;
    add_header X-Data-Source "vps-local" always;
}

location = /.well-known/ai-plugin.json {
    alias /var/www/pepperoni/repo/public/.well-known/ai-plugin.json;
    default_type application/json;
    charset utf-8;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=600" always;
    add_header X-Data-Source "vps-local" always;
}

location = /api/products {
    alias /var/www/pepperoni/data/products.json;
    default_type application/json;
    charset utf-8;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=60" always;
    add_header X-Data-Source "vps-local" always;
}

location = /products.json {
    alias /var/www/pepperoni/data/products.json;
    default_type application/json;
    charset utf-8;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=60" always;
    add_header X-Data-Source "vps-local" always;
}
