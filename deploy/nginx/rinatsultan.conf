# rinatsultan.com — Selectel VPS, DNS only. Same access model as pepperoni.tatar.

server {
    listen 80;
    listen [::]:80;
    server_name rinatsultan.com www.rinatsultan.com;
    root /var/www/rinatsultan/current;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://rinatsultan.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.rinatsultan.com;

    ssl_certificate /etc/letsencrypt/live/rinatsultan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rinatsultan.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://rinatsultan.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rinatsultan.com;

    root /var/www/rinatsultan/current;
    index index.html;
    autoindex off;

    ssl_certificate /etc/letsencrypt/live/rinatsultan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rinatsultan.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:RinatTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self' https://isitagentready.com; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self'; upgrade-insecure-requests" always;
    add_header Link '</.well-known/api-catalog>; rel="api-catalog", </.well-known/ai-catalog.json>; rel="describedby"; type="application/json", </.well-known/mcp/server-card.json>; rel="describedby"; type="application/json", </.well-known/agent-skills/index.json>; rel="describedby"; type="application/json", </llms.txt>; rel="alternate"; type="text/markdown", </index.md>; rel="alternate"; type="text/markdown", </auth.md>; rel="alternate"; type="text/markdown"' always;

    if ($http_accept ~* text/markdown) {
        rewrite ^/$ /index.md last;
        rewrite ^/en/?$ /en/index.md last;
    }

    location = / {
        try_files /index.html =404;
        expires -1;
    }

    location = /en {
        return 301 /en/;
    }

    location = /en/ {
        try_files /en/index.html =404;
        expires -1;
    }

    location = /llms.txt {
        types { }
        default_type "text/markdown; charset=utf-8";
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
        expires 1h;
    }

    location = /en/llms.txt {
        types { }
        default_type "text/markdown; charset=utf-8";
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
        expires 1h;
    }

    location = /.well-known/llms.txt {
        types { }
        default_type "text/markdown; charset=utf-8";
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
        expires 1h;
    }

    location = /robots.txt {
        try_files $uri =404;
        expires -1;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }
    location = /sitemap.xml { try_files $uri =404; expires 1h; }

    location = /.well-known/agent-card.json {
        default_type "application/json";
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
        expires 1h;
    }

    location = /.well-known/api-catalog {
        default_type "application/linkset+json";
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
        expires 1h;
    }

    location = /.well-known/ai-catalog.json {
        default_type "application/json";
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
        expires 1h;
    }

    location = /.well-known/mcp.json {
        default_type "application/json";
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
        expires 1h;
    }

    location = /.well-known/mcp/server-card.json {
        default_type "application/json";
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
        expires 1h;
    }

    location = /.well-known/mcp/server-cards.json {
        default_type "application/json";
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
        expires 1h;
    }

    location = /.well-known/oauth-protected-resource {
        default_type "application/json; charset=utf-8";
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
        expires 1h;
    }

    location = /.well-known/oauth-authorization-server {
        default_type "application/json; charset=utf-8";
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
        expires 1h;
    }

    location = /.well-known/openid-configuration {
        default_type "application/json; charset=utf-8";
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
        expires 1h;
    }

    location = /.well-known/http-message-signatures-directory {
        default_type "application/http-message-signatures-directory+json";
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
        expires 1h;
    }

    location = /auth.md {
        default_type "text/markdown; charset=utf-8";
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
        expires 1h;
    }

    location = /oauth/authorize {
        default_type "text/html; charset=utf-8";
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
        expires 1h;
    }

    location ^~ /oauth/ {
        default_type "application/json; charset=utf-8";
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
        expires 1h;
    }

    location = /.well-known/agent-skills/index.json {
        default_type "application/json";
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
        expires 1h;
    }

    location ^~ /.well-known/ {
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
        expires 1h;
    }

    location ~ \.md$ {
        default_type "text/markdown; charset=utf-8";
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
        expires 1h;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    location ~* \.(?:css|js)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # No HTML fallback — missing paths must be real 404s for agent scanners.
    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }
}
