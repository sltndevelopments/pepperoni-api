# Render with scripts/render-yaratu-nginx.py before installing.

server {
    listen 80;
    listen [::]:80;
    server_name yaratu.com www.yaratu.com;
    return 301 https://yaratu.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.yaratu.com;

    ssl_certificate __YARATU_CERTIFICATE__;
    ssl_certificate_key __YARATU_CERTIFICATE_KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://yaratu.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name yaratu.com;

    root __YARATU_ROOT__;
    index index.html;
    autoindex off;

    ssl_certificate __YARATU_CERTIFICATE__;
    ssl_certificate_key __YARATU_CERTIFICATE_KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:YaratuTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' https://fonts.gstatic.com; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; upgrade-insecure-requests" always;

    location = / {
        try_files /index.html =404;
        expires -1;
    }

    location = /index.html {
        try_files $uri =404;
        expires -1;
    }

    location = /privacy.html {
        try_files $uri =404;
        expires -1;
    }

    location = /robots.txt {
        try_files $uri =404;
        expires 1h;
    }

    location = /sitemap.xml {
        try_files $uri =404;
        expires 1h;
    }

    location = /llms.txt {
        try_files $uri =404;
        expires 1h;
    }

    location = /llms-full.txt {
        try_files $uri =404;
        expires 1h;
    }

    location = /ai.txt {
        try_files $uri =404;
        expires 1h;
    }

    location ^~ /data/ {
        try_files $uri =404;
        expires 1h;
    }

    location ^~ /feeds/ {
        try_files $uri =404;
        expires 1h;
    }

    # The old label generator is not part of the generated public dist.
    location = /label {
        return 410;
    }

    location = /label/ {
        return 410;
    }

    location ^~ /internal/ {
        return 404;
    }

    location = /internal {
        return 404;
    }

    location ~ ^/(?:_headers|_redirects|_routes\.json)$ {
        return 404;
    }

    location ~ /\.(?!well-known/) {
        deny all;
    }

    location ~* \.(?:css|js|json|svg|png|jpe?g|webp|gif|ico)$ {
        try_files $uri =404;
        expires 7d;
    }

    location / {
        try_files $uri =404;
        expires -1;
    }
}
