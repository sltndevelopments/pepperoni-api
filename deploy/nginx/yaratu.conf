# Render with scripts/render-yaratu-nginx.py before installing.

server {
    listen 80;
    listen [::]:80;
    server_name yaratu.com www.yaratu.com;
    return 301 https://yaratu.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.yaratu.com;

    ssl_certificate __YARATU_CERTIFICATE__;
    ssl_certificate_key __YARATU_CERTIFICATE_KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://yaratu.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name yaratu.com;

    root __YARATU_ROOT__;
    index index.html;
    autoindex off;

    ssl_certificate __YARATU_CERTIFICATE__;
    ssl_certificate_key __YARATU_CERTIFICATE_KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:YaratuTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' https://fonts.gstatic.com; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; upgrade-insecure-requests" always;
    add_header Link '</.well-known/api-catalog>; rel="api-catalog", </.well-known/ai-catalog.json>; rel="describedby", </index.md>; rel="alternate"; type="text/markdown"' always;

    if ($http_accept ~* text/markdown) {
        rewrite ^/$ /index.md last;
        rewrite ^/en/?$ /en/index.md last;
    }

    location = / {
        try_files /index.html =404;
        expires -1;
    }

    location = /index.html {
        try_files $uri =404;
        expires -1;
    }

    location = /privacy.html {
        try_files $uri =404;
        expires -1;
    }

    location = /robots.txt {
        try_files $uri =404;
        expires 1h;
    }

    location = /sitemap.xml {
        try_files $uri =404;
        expires 1h;
    }

    location = /llms.txt {
        try_files $uri =404;
        expires 1h;
    }

    location = /llms-full.txt {
        try_files $uri =404;
        expires 1h;
    }

    location = /ai.txt {
        try_files $uri =404;
        expires 1h;
    }

    location = /index.md {
        default_type "text/markdown; charset=utf-8";
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
        expires 1h;
    }

    location = /en/index.md {
        default_type "text/markdown; charset=utf-8";
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
        expires 1h;
    }

    location ~ \.md$ {
        default_type "text/markdown; charset=utf-8";
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
        expires 1h;
    }

    location = /.well-known/api-catalog {
        default_type "application/linkset+json";
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
        expires 1h;
    }

    location = /.well-known/ai-catalog.json {
        default_type "application/json";
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
        expires 1h;
    }

    location ^~ /.well-known/agent-skills/ {
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
        expires 1h;
    }

    location ^~ /data/ {
        try_files $uri =404;
        expires 1h;
    }

    location ^~ /feeds/ {
        try_files $uri =404;
        expires 1h;
    }

    # The old label generator is not part of the generated public dist.
    location = /label {
        return 410;
    }

    location = /label/ {
        return 410;
    }

    # Retired editorial mockup — the design now lives on the homepage.
    location = /2 {
        return 301 /;
    }

    location = /2/ {
        return 301 /;
    }

    location ^~ /2/ {
        return 301 /;
    }

    location ^~ /internal/ {
        return 404;
    }

    location = /internal {
        return 404;
    }

    location ~ ^/(?:_headers|_redirects|_routes\.json)$ {
        return 404;
    }

    location ~ /\.(?!well-known/) {
        deny all;
    }

    location ~* \.(?:png|jpe?g|webp|gif|ico|svg)$ {
        try_files $uri =404;
        expires 365d;
    }

    location ~* \.(?:css|js|json)$ {
        try_files $uri =404;
        expires 7d;
    }

    location / {
        try_files $uri/index.html $uri =404;
        expires -1;
    }
}
