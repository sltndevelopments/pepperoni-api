# Serve SEO-critical files directly from VPS — bypasses Vercel edge cache
# Product catalog
location = /products.json {
    alias /var/www/pepperoni/data/products.json;
    add_header Cache-Control "public, max-age=60, must-revalidate" always;
    add_header Access-Control-Allow-Origin "*" always;
    default_type application/json;
}
location = /api/products {
    alias /var/www/pepperoni/data/products.json;
    add_header Cache-Control "public, max-age=60, must-revalidate" always;
    add_header Access-Control-Allow-Origin "*" always;
    default_type application/json;
}

# SEO / discovery files
location = /robots.txt {
    alias /var/www/pepperoni/repo/public/robots.txt;
    add_header Cache-Control "public, max-age=86400" always;
    default_type text/plain;
}
location = /ads.txt {
    alias /var/www/pepperoni/repo/public/ads.txt;
    add_header Cache-Control "public, max-age=86400" always;
    default_type text/plain;
}
location = /sitemap.xml {
    alias /var/www/pepperoni/repo/public/sitemap.xml;
    add_header Cache-Control "public, max-age=300" always;
    default_type application/xml;
}
location = /rss.xml {
    alias /var/www/pepperoni/repo/public/rss.xml;
    add_header Cache-Control "public, max-age=300" always;
    default_type application/atom+xml;
}
location = /feed.xml {
    alias /var/www/pepperoni/repo/public/feed.xml;
    add_header Cache-Control "public, max-age=300" always;
    default_type application/rss+xml;
}
location = /llms.txt {
    alias /var/www/pepperoni/repo/public/llms.txt;
    add_header Cache-Control "public, max-age=300" always;
    add_header Access-Control-Allow-Origin "*" always;
    types { text/markdown txt; }
    default_type "text/markdown; charset=utf-8";
}
location = /llms-full.txt {
    alias /var/www/pepperoni/repo/public/llms-full.txt;
    add_header Cache-Control "public, max-age=300" always;
    add_header Access-Control-Allow-Origin "*" always;
    types { text/markdown txt; }
    default_type "text/markdown; charset=utf-8";
}
location = /manifest.json {
    alias /var/www/pepperoni/repo/public/manifest.json;
    add_header Cache-Control "public, max-age=3600" always;
    default_type application/json;
}
location = /openapi.yaml {
    alias /var/www/pepperoni/repo/public/openapi.yaml;
    add_header Cache-Control "public, max-age=300" always;
    add_header Access-Control-Allow-Origin "*" always;
    default_type application/x-yaml;
}
# IndexNow verification keys (32-hex .txt at site root) — must be reachable
# for Bing/Yandex to validate our IndexNow submissions.
location ~ "^/[a-f0-9]{32}\.txt$" {
    root /var/www/pepperoni/repo/public;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400" always;
    default_type text/plain;
}
# UCP discovery (extensionless JSON) — Google Universal Commerce Protocol
location = /.well-known/ucp {
    root /var/www/pepperoni/repo/public;
    default_type application/json;
    add_header Cache-Control "public, max-age=300" always;
    add_header Access-Control-Allow-Origin "*" always;
    try_files $uri =404;
}
location ^~ /.well-known/ {
    root /var/www/pepperoni/repo/public;
    add_header Cache-Control "public, max-age=300" always;
    add_header Access-Control-Allow-Origin "*" always;
    try_files $uri =404;
}

# RU product pages
location ^~ /products/ {
    root /var/www/pepperoni/repo/public;
    try_files $uri $uri.html $uri/index.html =404;
    add_header Cache-Control "public, max-age=60, must-revalidate" always;
    include /etc/nginx/snippets/pepperoni-security-headers.conf;
    default_type text/html;
}
# EN product pages
location ^~ /en/products/ {
    root /var/www/pepperoni/repo/public;
    try_files $uri $uri.html $uri/index.html =404;
    add_header Cache-Control "public, max-age=60, must-revalidate" always;
    include /etc/nginx/snippets/pepperoni-security-headers.conf;
    default_type text/html;
}
# Main static HTML pages (home, category, blog index, etc.)
location = / {
    root /var/www/pepperoni/repo/public;
    try_files /index.html =404;
    add_header Cache-Control "public, max-age=60, must-revalidate" always;
    add_header Access-Control-Allow-Origin "*" always;
    include /etc/nginx/snippets/pepperoni-security-headers.conf;
    default_type text/html;
}
location = /en/ {
    root /var/www/pepperoni/repo/public;
    try_files /en/index.html =404;
    add_header Cache-Control "public, max-age=60, must-revalidate" always;
    add_header Access-Control-Allow-Origin "*" always;
    include /etc/nginx/snippets/pepperoni-security-headers.conf;
    default_type text/html;
}
# Discontinued product line: myasnyie-zagotovki (farsh/meat-preps) removed
# from Google Sheets catalog; page content refers to SKUs that no longer
# exist. RU+EN. See data/audit_reconcile.md (2026-07-05).
location = /myasnyie-zagotovki {
    return 410;
}
location = /en/myasnyie-zagotovki {
    return 410;
}

# Category / landing pages (pepperoni, bakery, about, etc.) — static HTML with clean URLs
location ~ ^/(pepperoni|bakery|about|delivery|faq|blog|kazylyk|pizzeria|sosiski-dlya-hotdog|sosiski-halyal|vetchina-optom|kolbasy-kopchyonye|kolbasy-varenye|kotlety-dlya-burgerov|vyipechka-halyal|myasnyie-zagotovki|pepperoni-dlya-horeca|pepperoni-dlya-pizzerii|pepperoni-optom|pepperoni-private-label|pepperoni-v-narezke)$ {
    root /var/www/pepperoni/repo/public;
    try_files $uri.html $uri/index.html =404;
    add_header Cache-Control "public, max-age=60, must-revalidate" always;
    include /etc/nginx/snippets/pepperoni-security-headers.conf;
    default_type text/html;
}
location ~ ^/en/(pepperoni|bakery|about|delivery|faq|blog|kazylyk|pizzeria)$ {
    root /var/www/pepperoni/repo/public;
    try_files $uri.html $uri/index.html =404;
    add_header Cache-Control "public, max-age=60, must-revalidate" always;
    include /etc/nginx/snippets/pepperoni-security-headers.conf;
    default_type text/html;
}

# ───────── AI Discovery Files (ADF) — served directly from VPS ─────────
# Bypasses Vercel cleanUrls (which 308-redirects .html → /) and ensures
# canonical 200 OK with correct MIME types for the AI Visibility Checker.

location = /ai.txt {
    alias /var/www/pepperoni/repo/public/ai.txt;
    add_header Cache-Control "public, max-age=300" always;
    add_header Access-Control-Allow-Origin "*" always;
    default_type text/plain;
}
