# llms.html — explicit static HTML (avoids Vercel cleanUrls 308 redirect)
location = /llms.html {
    alias /var/www/pepperoni/repo/public/llms-page.html;
    add_header Cache-Control "public, max-age=300" always;
    add_header Access-Control-Allow-Origin "*" always;
    include /etc/nginx/snippets/pepperoni-security-headers.conf;
    default_type text/html;
}
location = /llms {
    alias /var/www/pepperoni/repo/public/llms-page.html;
    add_header Cache-Control "public, max-age=300" always;
    add_header Access-Control-Allow-Origin "*" always;
    include /etc/nginx/snippets/pepperoni-security-headers.conf;
    default_type text/html;
