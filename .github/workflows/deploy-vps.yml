name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate trust-reset policy
        run: |
          python3 scripts/index_policy_check.py
          python3 scripts/authority_program_check.py
          python3 scripts/measurement_governance_check.py

      # Deploy = git sync, NOT rsync --delete. The VPS repo is a live git clone
      # whose untracked files are runtime state the agents create between
      # commits (sqlite DB, strategy.json, freshly generated pages). The old
      # rsync --delete wiped anything not yet on GitHub on EVERY deploy —
      # silently destroying the brain's strategy and the SEO database whenever
      # a push raced the daily pipeline. git reset --hard updates tracked files
      # and leaves untracked runtime state alone.
      #
      # "Untracked" is the load-bearing word: the spend ledgers below ARE
      # tracked, so reset --hard rolls them back to whatever the last push
      # contained. That silently rewinds the counters that enforce
      # LLM_DAILY_BUDGET_USD / OPUS_MONTHLY_BUDGET_USD — the budget guard fails
      # open, which is how a $5/day cap once allowed $8.94. Observed again on
      # 2026-08-23: opus_budget.json reverted to a July snapshot mid-month.
      # The VPS is the only writer and these counters only move forward, so
      # carry them across the reset.
      - name: Deploy via git sync
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /var/www/pepperoni/repo
            LEDGERS="data/daily_ledger.json data/opus_budget.json data/llm_costs.json data/health.json"
            KEEP=$(mktemp -d)
            for f in $LEDGERS; do
              if [ -f "$f" ]; then install -D "$f" "$KEEP/$f"; fi
            done
            git fetch origin main
            git reset --hard origin/main
            for f in $LEDGERS; do
              if [ -f "$KEEP/$f" ]; then cp -a "$KEEP/$f" "$f"; fi
            done
            rm -rf "$KEEP"
            echo "Deployed: $(git log -1 --oneline)"
            # nginx serves /videos/ from media/, not repo/public/videos/
            if [ -d public/videos ]; then
              mkdir -p /var/www/pepperoni/media/videos
              cp -f public/videos/* /var/www/pepperoni/media/videos/
            fi

      - name: Install deps on VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: cd /var/www/pepperoni/repo && npm install --omit=dev

      - name: Write SEO Agent env file on VPS
        uses: appleboy/ssh-action@v1.0.0
        env:
          GSC_SERVICE_ACCOUNT_KEY: ${{ secrets.GSC_SERVICE_ACCOUNT_KEY }}
          YANDEX_WM_TOKEN:         ${{ secrets.YANDEX_WM_TOKEN }}
          YANDEX_METRIKA_TOKEN:    ${{ secrets.YANDEX_METRIKA_TOKEN }}
          LEADS_BOT_TOKEN:         ${{ secrets.LEADS_BOT_TOKEN }}
          LEADS_GROUP_ID:          ${{ secrets.LEADS_GROUP_ID }}
          DEEPSEEK_API_KEY:          ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_KEY:       ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_PROXY:         ${{ secrets.ANTHROPIC_PROXY }}
          ANTHROPIC_PROXY_FALLBACK: ${{ secrets.ANTHROPIC_PROXY_FALLBACK }}
          ASOCKS_API_KEY:          ${{ secrets.ASOCKS_API_KEY }}
          TELEGRAM_BOT_TOKEN:      ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:        ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_PASSWORD:             ${{ secrets.TG_PASSWORD }}
          PPLX_API_KEY:            ${{ secrets.PPLX_API_KEY }}
          GEMINI_API_KEY:          ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY:          ${{ secrets.OPENAI_API_KEY }}
          XAI_API_KEY:             ${{ secrets.XAI_API_KEY }}
          OPENROUTER_API_KEY:      ${{ secrets.OPENROUTER_API_KEY }}
          YANDEX_SEARCH_API_KEY:   ${{ secrets.YANDEX_SEARCH_API_KEY }}
          INDEXNOW_KEY:            ${{ secrets.INDEXNOW_KEY }}
          BING_CLIENT_ID:          ${{ secrets.BING_CLIENT_ID }}
          BING_CLIENT_SECRET:      ${{ secrets.BING_CLIENT_SECRET }}
          GH_PAT:                  ${{ secrets.GH_PAT }}
          PAGESPEED_API_KEY:       ${{ secrets.PAGESPEED_API_KEY }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GSC_SERVICE_ACCOUNT_KEY,YANDEX_WM_TOKEN,YANDEX_METRIKA_TOKEN,LEADS_BOT_TOKEN,LEADS_GROUP_ID,DEEPSEEK_API_KEY,ANTHROPIC_API_KEY,ANTHROPIC_PROXY,ANTHROPIC_PROXY_FALLBACK,ASOCKS_API_KEY,TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID,TG_PASSWORD,PPLX_API_KEY,GEMINI_API_KEY,OPENAI_API_KEY,XAI_API_KEY,OPENROUTER_API_KEY,YANDEX_SEARCH_API_KEY,INDEXNOW_KEY,BING_CLIENT_ID,BING_CLIENT_SECRET,GH_PAT,PAGESPEED_API_KEY
          script: |
            # GSC key is JSON — base64-encode it so it fits on one line safely
            GSC_B64=$(echo "$GSC_SERVICE_ACCOUNT_KEY" | base64 -w0)
            # Native ChatGPT/Grok keys: keep VPS value if GitHub Secret is still empty
            # so a deploy cannot wipe a key the owner installed by hand.
            if [ -f /var/www/pepperoni/seo-agent.env ]; then
              if [ -z "${OPENAI_API_KEY:-}" ]; then
                OPENAI_API_KEY=$(grep '^OPENAI_API_KEY=' /var/www/pepperoni/seo-agent.env | cut -d= -f2- || true)
              fi
              if [ -z "${XAI_API_KEY:-}" ]; then
                XAI_API_KEY=$(grep '^XAI_API_KEY=' /var/www/pepperoni/seo-agent.env | cut -d= -f2- || true)
              fi
            fi
            {
              echo "GSC_SERVICE_ACCOUNT_KEY_B64=$GSC_B64"
              echo "YANDEX_WM_TOKEN=$YANDEX_WM_TOKEN"
              echo "YANDEX_METRIKA_TOKEN=${YANDEX_METRIKA_TOKEN:-}"
              echo "LEADS_BOT_TOKEN=${LEADS_BOT_TOKEN:-}"
              echo "LEADS_GROUP_ID=${LEADS_GROUP_ID:-}"
              echo "DEEPSEEK_API_KEY=$DEEPSEEK_API_KEY"
              echo "ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY"
              echo "ANTHROPIC_PROXY=$ANTHROPIC_PROXY"
              echo "ANTHROPIC_PROXY_FALLBACK=${ANTHROPIC_PROXY_FALLBACK:-}"
              echo "ANTHROPIC_PROXY_LOCK=1"
              echo "ASOCKS_API_KEY=${ASOCKS_API_KEY:-}"
              # Dedicated monthly budget for the BRAIN (Fable + escalations),
              # tracked separately from the "hands" via data/opus_budget.json.
              echo "OPUS_MONTHLY_BUDGET_USD=30"
              # Brain model. Fable 5 was suspended for all Anthropic customers by
              # a US gov export-control directive (2026-06-12); using Opus 5
              # (2026-07-24 release, same $5/$25 rate as 4.8, half the price of
              # Fable). Set to claude-fable-5 here if/when Fable returns.
              echo "OPUS_MODEL=claude-opus-5"
              # Cost & quality controls (set 2026-06-11). Quality mode: no new geo
              # generation, aggressive CTR optimization of existing pages, hard
              # daily spend cap. See scripts/claude_client.py:_budget_guard.
              echo "LLM_DAILY_BUDGET_USD=5"
              # Escalation thresholds raised 2026-07-31: escalate_brain was the
              # single biggest ledger line ($17/mo), mostly redundant same-day
              # Opus re-plans. See scripts/escalate_brain.py.
              echo "ESC_DEMAND_IMPR=110"
              echo "ESC_WIN_STREAK=4"
              echo "ESC_COOLDOWN_HOURS=18"
              # GEO_PER_TICK caps the 3-hourly worker; the brain steers the real
              # daily volume via strategy.geo_daily_target. 3×8 ticks = 24/day max.
              echo "GEO_PER_TICK=3"
              echo "OPT_POS_LOW=1.5"
              echo "OPT_POS_HIGH=20"
              echo "OPT_MAX_CHANGES=20"
              echo "OPT_MIN_IMPR=25"
              echo "OPT_MAX_CTR=0.02"
              echo "TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN"
              echo "TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}"
              echo "TG_PASSWORD=${TG_PASSWORD:-}"
              echo "PPLX_API_KEY=${PPLX_API_KEY:-}"
              echo "GEMINI_API_KEY=${GEMINI_API_KEY:-}"
              echo "GEMINI_MODEL=gemini-3.7-flash"
              echo "OPENAI_API_KEY=${OPENAI_API_KEY:-}"
              echo "XAI_API_KEY=${XAI_API_KEY:-}"
              echo "OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}"
              echo "YANDEX_SEARCH_API_KEY=${YANDEX_SEARCH_API_KEY:-}"
              echo "INDEXNOW_KEY=$INDEXNOW_KEY"
              echo "BING_CLIENT_ID=$BING_CLIENT_ID"
              echo "BING_CLIENT_SECRET=$BING_CLIENT_SECRET"
              echo "GITHUB_TOKEN=$GH_PAT"
              echo "PAGESPEED_API_KEY=${PAGESPEED_API_KEY:-}"
            } > /var/www/pepperoni/seo-agent.env
            chmod 600 /var/www/pepperoni/seo-agent.env
            echo "✅ seo-agent.env written ($(wc -c < /var/www/pepperoni/seo-agent.env) bytes)"
            # (re)start the Telegram bot if a token is configured
            if grep -q "^TELEGRAM_BOT_TOKEN=." /var/www/pepperoni/seo-agent.env; then
              systemctl restart pepperoni-tgbot.service 2>/dev/null || true
              echo "🤖 telegram bot (re)started"
            fi

            # Set up git on VPS so SEO agent can commit & push autonomously
            git config --global --add safe.directory /var/www/pepperoni/repo
            cd /var/www/pepperoni/repo
            git config user.email "seo-agent@pepperoni.tatar"
            git config user.name  "SEO Agent"
            # SSH deploy key (gh_deploy_key) is used for git push/pull — no PAT needed.
            # Verify SSH remote is set and fetch works.
            git remote set-url origin git@github.com:sltndevelopments/pepperoni-api.git
            git fetch origin main --quiet 2>&1 && echo "✅ git fetch OK via SSH deploy key"

      - name: Update API data/products.json on VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            mkdir -p /var/www/pepperoni/data
            cp /var/www/pepperoni/repo/public/products.json /var/www/pepperoni/data/products.json
            echo "✅ data/products.json updated: $(python3 -c "import json; d=json.load(open('/var/www/pepperoni/data/products.json')); print(len(d['products']), 'products, first price:', d['products'][0]['offers'].get('price','?'))" 2>/dev/null || echo 'copied')"

      - name: Restart partner-intake service on VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # partner-intake is managed by systemd (unit already installed by
            # deploy-partner-intake.sh). git reset --hard above updated the code;
            # restart picks up any changes to partner-intake-server.py.
            # Using systemctl restart (not nohup) so systemd manages restarts.
            if systemctl is-enabled partner-intake &>/dev/null; then
              systemctl restart partner-intake
              sleep 2
              if ss -tlnp | grep -q ':5001'; then
                echo "✅ partner-intake restarted and listening on :5001"
              else
                echo "⚠️  partner-intake restarted but :5001 not listening — check logs"
                journalctl -u partner-intake --no-pager -n 20
              fi
            else
              echo "ℹ️  partner-intake unit not installed yet — skipping restart (run deploy-partner-intake.sh once to install)"
            fi

      - name: Restart lead-intake service on VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # gunicorn runs lead_intake_server from the repo working tree, so the
            # git reset above changes the file but the workers keep the old code
            # in memory until restarted. Without this step a fix to the form
            # handler (e.g. phone validation) silently never reaches production.
            UNIT=pepperoni-lead-intake
            if systemctl is-enabled "$UNIT" &>/dev/null; then
              systemctl restart "$UNIT"
              sleep 2
              if curl -fsS --max-time 5 http://127.0.0.1:5002/lead-health | grep -q '"ok"'; then
                echo "✅ $UNIT restarted, /lead-health ok"
              else
                echo "⚠️  $UNIT restarted but /lead-health not ok — check logs"
                journalctl -u "$UNIT" --no-pager -n 20
              fi
            else
              echo "ℹ️  $UNIT unit not installed — skipping restart"
            fi

      - name: Install SEO Agent cron on VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            mkdir -p /var/www/pepperoni/repo/data/logs
            mkdir -p /var/www/pepperoni/repo/public/blog

            # Add SEO agent cron if not already present
            CRON_LINE="30 5 * * * bash /var/www/pepperoni/repo/scripts/seo-agent-vps.sh >> /var/log/pepperoni-seo-agent.log 2>&1"
            if ! crontab -l 2>/dev/null | grep -q "seo-agent-vps.sh"; then
              (crontab -l 2>/dev/null; echo "$CRON_LINE") | crontab -
              echo "✅ SEO agent cron installed (08:30 MSK daily)"
            else
              echo "ℹ️  SEO agent cron already present"
            fi

            # Add price sync cron if not already present (every 10 min)
            SYNC_CRON="*/10 * * * * bash /var/www/pepperoni/repo/scripts/sync-vps.sh >> /var/log/pepperoni-sync.log 2>&1"
            if ! crontab -l 2>/dev/null | grep -q "sync-vps.sh"; then
              (crontab -l 2>/dev/null; echo "$SYNC_CRON") | crontab -
              echo "✅ Price sync cron installed (every 10 min)"
            else
              echo "ℹ️  Price sync cron already present"
            fi

            # Add pipeline watchdog cron (2h after the daily agent starts)
            WATCHDOG_CRON="30 7 * * * cd /var/www/pepperoni/repo && python3 scripts/pipeline_watchdog.py >> /var/log/pepperoni-watchdog.log 2>&1"
            if ! crontab -l 2>/dev/null | grep -q "pipeline_watchdog.py"; then
              (crontab -l 2>/dev/null; echo "$WATCHDOG_CRON") | crontab -
              echo "✅ Pipeline watchdog cron installed (10:30 MSK daily)"
            else
              echo "ℹ️  Pipeline watchdog cron already present"
            fi
            echo "=== Current crontab ===" && crontab -l

      - name: Ensure moscow-leads bot + Friday digest cron
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            mkdir -p /var/www/pepperoni/repo/moscow-leads/data
            # systemd unit (starts only when token is configured)
            cp /var/www/pepperoni/repo/deploy/moscow-lead-bot.service /etc/systemd/system/moscow-lead-bot.service
            systemctl daemon-reload
            if [ -f /var/www/pepperoni/moscow-leads.env ] && grep -qE '^MOSCOW_LEAD_BOT_TOKEN=.+' /var/www/pepperoni/moscow-leads.env; then
              systemctl enable moscow-lead-bot.service
              systemctl restart moscow-lead-bot.service
              sleep 1
              systemctl is-active moscow-lead-bot.service && echo "✅ moscow-lead-bot.service active"
            else
              echo "ℹ️  moscow-leads.env / MOSCOW_LEAD_BOT_TOKEN not set — bot unit installed but not started"
            fi
            # hourly tick (deadlines + 72h) and Friday 17:00 MSK digest
            TICK='5 * * * * cd /var/www/pepperoni/repo/moscow-leads && PYTHONPATH=. python3 scheduler.py tick >> data/scheduler.log 2>&1'
            DIGEST='0 14 * * 5 cd /var/www/pepperoni/repo/moscow-leads && PYTHONPATH=. python3 scheduler.py digest >> data/scheduler.log 2>&1'
            if ! crontab -l 2>/dev/null | grep -q "moscow-leads && PYTHONPATH=. python3 scheduler.py tick"; then
              (crontab -l 2>/dev/null; echo "$TICK") | crontab -
              echo "✅ moscow-leads tick cron installed"
            fi
            if ! crontab -l 2>/dev/null | grep -q "moscow-leads && PYTHONPATH=. python3 scheduler.py digest"; then
              (crontab -l 2>/dev/null; echo "$DIGEST") | crontab -
              echo "✅ moscow-leads Friday digest cron installed (17:00 MSK)"
            fi

      - name: Apply SEO trust-reset redirects and 410 policy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            chmod +x /var/www/pepperoni/repo/scripts/apply_nginx_trust_reset.sh
            bash /var/www/pepperoni/repo/scripts/apply_nginx_trust_reset.sh /var/www/pepperoni/repo

      - name: Nudge Google index (sitemap + hot URLs / 301s)
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -a
            . /var/www/pepperoni/seo-agent.env
            set +a
            cd /var/www/pepperoni/repo
            bash scripts/nudge_google_after_seo.sh || echo "⚠️  indexing nudge failed (non-fatal)"

      # Runs LAST on purpose. These scripts only polish nginx headers and are
      # idempotent; on failure they restore the previous vhost, so the site keeps
      # serving. When this step sat before the deploy body, one bad snippet
      # (an orphan `}` accumulated by the llms.txt patch) failed the step and
      # GitHub skipped everything after it — including the index nudge. A header
      # tweak must never be able to cancel indexing.
      - name: Apply Content-Security-Policy + agent discovery headers
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # The previous CSP allowed only googletagmanager.com in frame-src.
            # Brave/Chrome then showed «Этот контент заблокирован» for the
            # youtube-nocookie iframes on /pepperoni. Canonical policy lives in
            # deploy/nginx/security-headers.csp.snippet.
            chmod +x /var/www/pepperoni/repo/scripts/apply_nginx_csp.sh
            bash /var/www/pepperoni/repo/scripts/apply_nginx_csp.sh /var/www/pepperoni/repo
            chmod +x /var/www/pepperoni/repo/scripts/apply_nginx_agent_discovery.sh
            bash /var/www/pepperoni/repo/scripts/apply_nginx_agent_discovery.sh /var/www/pepperoni/repo
            chmod +x /var/www/pepperoni/repo/scripts/apply_nginx_api_products.sh
            bash /var/www/pepperoni/repo/scripts/apply_nginx_api_products.sh /var/www/pepperoni/repo
            if systemctl list-unit-files | grep -q '^pepperoni-mcp.service'; then
              install -m 644 /var/www/pepperoni/repo/deploy/pepperoni-mcp.service /etc/systemd/system/pepperoni-mcp.service
              systemctl daemon-reload
              systemctl restart pepperoni-mcp.service
              sleep 1
              systemctl is-active pepperoni-mcp.service && echo "✅ pepperoni-mcp.service active"
            fi
            if [ -d /var/www/pepperoni/repo/rinatsultan ]; then
              mkdir -p /var/www/rinatsultan/current
              rsync -a --delete \
                --exclude '_headers' \
                /var/www/pepperoni/repo/rinatsultan/ /var/www/rinatsultan/current/
              if [ -f /etc/letsencrypt/live/rinatsultan.com/fullchain.pem ]; then
                install -m 644 /var/www/pepperoni/repo/deploy/nginx/rinatsultan.conf \
                  /etc/nginx/sites-available/rinatsultan.conf
                ln -sfn /etc/nginx/sites-available/rinatsultan.conf /etc/nginx/sites-enabled/rinatsultan.conf
                nginx -t && systemctl reload nginx
                echo "✅ rinatsultan.com static site updated"
              fi
            fi
