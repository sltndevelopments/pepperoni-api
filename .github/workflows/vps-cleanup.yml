name: VPS cleanup

on:
  workflow_dispatch:
    inputs:
      mode:
        description: mode
        type: choice
        options:
          - dry-run
          - apply
        default: dry-run
  push:
    branches:
      - main
    paths:
      - ops/cleanup-dryrun-trigger.txt
      - ops/cleanup-apply-trigger.txt

concurrency:
  group: vps-recon
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve mode
        id: mode
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode || 'dry-run' }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          before="${{ github.event.before }}"
          if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ]; then
            mode=$(git diff --name-status "$before" "${{ github.sha }}" | bash scripts/vps_cleanup_resolve_mode.sh)
          else
            mode=$(git diff --name-status "${{ github.sha }}^" "${{ github.sha }}" | bash scripts/vps_cleanup_resolve_mode.sh)
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          if [ "$mode" = "none" ]; then
            echo "vps-cleanup: skip, mode=none"
          fi

      - name: Skip if Deploy to VPS is in_progress
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          n=$(gh api "repos/$REPO/actions/workflows/deploy-vps.yml/runs?status=in_progress&per_page=1" --jq '.total_count' 2>/dev/null) || {
            echo "vps-cleanup: deploy status check failed" >&2
            exit 1
          }
          if [ "$n" -gt 0 ]; then
            echo "vps-cleanup: skip, deploy in_progress"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Cleanup over SSH
        if: steps.gate.outputs.skip != '1' && (steps.mode.outputs.mode == 'dry-run' || steps.mode.outputs.mode == 'apply')
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          test -n "${VPS_HOST:-}"
          test -n "${VPS_SSH_KEY:-}"
          test -n "${MODE:-}"
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          trap 'rm -f ~/.ssh/vps_key' EXIT
          guard_deadline=$(( $(date +%s) + 180 ))
          while :; do
            min=$(date +%M)
            min=$((10#$min))
            rem=$(( min % 10 ))
            if [ "$rem" -ge 2 ] && [ "$rem" -le 8 ]; then
              break
            fi
            if [ "$(date +%s)" -ge "$guard_deadline" ]; then
              break
            fi
            sleep 15
          done
          set +e
          ssh -q -o BatchMode=yes -i ~/.ssh/vps_key \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
            "root@${VPS_HOST}" \
            "export MODE=${MODE}; bash -s" \
            < scripts/vps_cleanup.sh \
            2>/dev/null
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "vps-cleanup: ssh failed" >&2
            exit 1
          fi
