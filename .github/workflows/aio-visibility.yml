name: AIO Visibility — AI citability monitor (weekly)

# Buyer-intent panel: memory vs live-search, never mixed.
# Score is written only on real answers; proxy/API fail → status=fail, not 0%.
# OPENAI_API_KEY must be a GitHub Secret (do not copy the operator key into git).

on:
  schedule:
    - cron: "30 7 * * 1"   # Mondays 07:30 UTC (after competitor-scout)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aio-visibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run AIO-Visibility
        env:
          DEEPSEEK_API_KEY:   ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_PROXY:    ${{ secrets.ANTHROPIC_PROXY }}
          PPLX_API_KEY:       ${{ secrets.PPLX_API_KEY }}
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL:       gemini-3.7-flash
          OPENAI_API_KEY:     ${{ secrets.OPENAI_API_KEY }}
          OPENAI_SEARCH_MODEL: gpt-5.6
          XAI_API_KEY:        ${{ secrets.XAI_API_KEY }}
          MOONSHOT_API_KEY:   ${{ secrets.MOONSHOT_API_KEY }}
          MISTRAL_API_KEY:    ${{ secrets.MISTRAL_API_KEY }}
          ZHIPU_API_KEY:      ${{ secrets.ZHIPU_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/aio_visibility.py --core
        continue-on-error: true

      - name: Commit AIO visibility ledger
        run: |
          git config user.email "seo-agent@pepperoni.tatar"
          git config user.name  "AIO Visibility"
          git add data/aio_visibility.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(aio): citability snapshot $(date +%Y-%m-%d)"
            for attempt in 1 2 3 4 5; do
              git pull --rebase --no-edit origin main || { git rebase --abort 2>/dev/null || true; exit 1; }
              if git push origin main; then echo "✅ pushed (attempt ${attempt})"; break; fi
              echo "push race, retry ${attempt}/5"; sleep $((attempt * 3))
            done
          else
            echo "No AIO changes to commit"
          fi
        continue-on-error: true
