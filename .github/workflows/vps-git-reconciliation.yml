name: VPS git reconciliation (read-only)

# Public repo: Actions logs and artifacts are world-readable.
# Stream the collector tar into memory, print aggregate counts only, encrypt
# with age, upload only the .age file. The plaintext tar never touches disk.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ops/recon-trigger.txt

# Own group so a queued recon cannot cancel a pending Deploy to VPS.
concurrency:
  group: vps-recon
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout reporter
        uses: actions/checkout@v4

      - name: Wait until no Deploy to VPS run is active
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 600 ))
          quiet=0
          while :; do
            n=0
            for s in queued in_progress waiting pending requested; do
              c=$(gh api "repos/$REPO/actions/workflows/deploy-vps.yml/runs?status=$s&per_page=1" --jq '.total_count' 2>/dev/null) || {
                echo "vps-git-reconciliation: deploy status check failed" >&2
                exit 1
              }
              n=$(( n + c ))
            done
            if [ "$n" -eq 0 ]; then
              quiet=$(( quiet + 1 ))
              [ "$quiet" -ge 2 ] && break
            else
              quiet=0
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "vps-git-reconciliation: deploy still active after 10 min" >&2
              exit 1
            fi
            sleep 20
          done
          min=$(date +%M)
          min=$((10#$min))
          if [ $(( min % 10 )) -eq 0 ] || [ $(( min % 10 )) -eq 9 ]; then
            sleep 90
          fi

      - name: Install age
        run: sudo apt-get update -qq && sudo apt-get install -y age

      - name: Collect, count, and encrypt
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "${VPS_HOST:-}"
          test -n "${VPS_SSH_KEY:-}"
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          trap 'rm -f ~/.ssh/vps_key' EXIT
          # Remote: python stdin, tar on stdout. Pipe straight into the sealer.
          # No recon-report.tar, no unpack, no plaintext on disk.
          # Public logs: hide ssh stderr; on failure print a fixed line only.
          set +e
          ssh -q -o BatchMode=yes -i ~/.ssh/vps_key \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
            "root@${VPS_HOST}" \
            'export GIT_OPTIONAL_LOCKS=0; python3 -' \
            < scripts/vps_git_recon_readonly.sh \
            2>/dev/null \
            | python3 scripts/seal_vps_git_recon.py \
                --recipient-file ops/recon-age.pub \
                --out recon-report.tar.age
          # Snapshot the whole array first. Reading PIPESTATUS[0] then [1]
          # resets it; under set -u the second read is an unbound variable.
          rcs=("${PIPESTATUS[@]}")
          ssh_rc=${rcs[0]}
          seal_rc=${rcs[1]}
          set -e
          if [ "$ssh_rc" -ne 0 ]; then
            echo "vps-git-reconciliation: ssh failed" >&2
            exit 1
          fi
          if [ "$seal_rc" -ne 0 ]; then
            echo "vps-git-reconciliation: seal failed" >&2
            exit 1
          fi
          test -f recon-report.tar.age
          test ! -e recon-report.tar
          test ! -d recon-report

      - name: Upload encrypted report
        uses: actions/upload-artifact@v4
        with:
          name: vps-git-reconciliation
          path: recon-report.tar.age
          if-no-files-found: error
          retention-days: 30
