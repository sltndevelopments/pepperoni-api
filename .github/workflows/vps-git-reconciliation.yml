name: VPS git reconciliation (read-only)

# Manual only. Uses the same Selectel SSH secrets as deploy-vps.yml.
# Must not change anything on the VPS — stream a tar to the runner, write locally.
on:
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout reporter
        uses: actions/checkout@v4

      - name: Collect read-only report over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "${VPS_HOST:-}"
          test -n "${VPS_SSH_KEY:-}"
          mkdir -p ~/.ssh recon-report
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          # Remote side: python stdin only, tar on stdout. No scp, no /tmp writes.
          ssh -i ~/.ssh/vps_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
            "root@${VPS_HOST}" \
            'export GIT_OPTIONAL_LOCKS=0; python3 -' \
            < scripts/vps_git_recon_readonly.sh \
            > recon-report.tar
          tar -xf recon-report.tar -C recon-report
          rm -f recon-report.tar ~/.ssh/vps_key
          # Empty porcelain is a clean working tree — accept a zero-byte file.
          test -f recon-report/git-status-porcelain.txt
          test -f recon-report/meta.txt
          echo "=== meta ==="
          cat recon-report/meta.txt

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: vps-git-reconciliation
          path: recon-report/
          if-no-files-found: error
          retention-days: 30
