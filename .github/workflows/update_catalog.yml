name: Update Catalog

on:
  schedule:
    - cron: '0 */6 * * *'  # every 6 hours
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Disabled 2026-07-02 (Task 0.2, stop dual scheduling): duplicates
    # scripts/sync-vps.sh, which already runs every 10 min on the VPS cron
    # (the canonical catalog sync per .cursor/rules/pepperoni-infra.mdc).
    # Running both raced on git push and risked stale-cache drift.
    if: false

    steps:
      - name: Checkout (main — Vercel production branch)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync from Google Sheets
        run: python3 scripts/sync-sheets.py

      - name: Generate RU product pages
        run: python3 scripts/gen-ru-products.py

      - name: Generate EN product pages
        run: python3 scripts/gen-en-products.py

      - name: Commit and push changes
        # Workflow is if:false. Do not auto-commit public/ HTML or products.json.
        # Catalog sync is VPS-only (scripts/sync-vps.sh).
        if: false
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: auto-update catalog from Google Sheets'
          file_pattern: data/descriptions-overrides.json
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'
